name: Generate and Broadcast Game

on:
  schedule:
    - cron: '0 6,17 * * *' # Запуск дважды в день (в 6:00 и 17:00 UTC)
  workflow_dispatch: # Кнопка ручного запуска в панели GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-genai python-telegram-bot

      - name: Run generator and broadcaster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PYTHONANYWHERE_URL: ${{ secrets.PYTHONANYWHERE_URL }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
        run: |
          python scripts/generate_and_broadcast.py
