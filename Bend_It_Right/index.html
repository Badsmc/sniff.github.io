<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SheetMetal 3D Simulator</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js для 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls для вращения 3D модели -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg: #141418;
      --panel: #1e1e24;
      --card: #282833;
      --accent: #4da6ff;
      --border: #383845;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background: var(--panel); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; color: var(--accent); }
    
    .app-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
    @media(min-width: 768px) { .app-container { flex-direction: row; } }

    /* 2D Canvas Area */
    .editor-zone { flex: 1; display: flex; flex-direction: column; position: relative; background: #0d0d10; }
    #flatCanvas { flex: 1; width: 100%; touch-action: none; cursor: crosshair; }
    .hint-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; pointer-events: none; border: 1px solid var(--border); }

    /* Controls Area */
    .controls-zone { width: 100%; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); overflow-y: auto; max-height: 45vh; }
    @media(min-width: 768px) { .controls-zone { width: 340px; border-top: none; border-left: 1px solid var(--border); max-height: 100%; } }

    .card { background: var(--card); padding: 12px; border-radius: 6px; border: 1px solid var(--border); }
    .card h3 { font-size: 0.8rem; text-transform: uppercase; color: #889; margin-bottom: 10px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 0.75rem; color: #bbb; margin-bottom: 4px; }
    select, input { width: 100%; height: 38px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 4px; padding: 0 8px; font-size: 0.9rem; margin-bottom: 8px; }
    
    button { width: 100%; height: 42px; background: var(--accent); color: #000; border: none; border-radius: 4px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 4px; }
    button:active { opacity: 0.8; }
    button.success { background: #00e676; }
    button.danger { background: #ff4d4d; color: #fff; }

    /* 3D Modal Window */
    #modal3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; }
    #modal3d header { background: #111; border-bottom: 1px solid #333; }
    #modal3d header button { width: auto; height: 32px; padding: 0 16px; margin: 0; }
    #container3d { flex: 1; width: 100%; position: relative; }
  </style>
</head>
<body>

  <header>
    <h1>SheetMetal 3D</h1>
    <button id="btnOpen3D" class="success" style="width: auto; height: 28px; padding: 0 12px; margin: 0;">Показать 3D Модель</button>
  </header>

  <div class="app-container">
    <!-- Зона 2D Развёртки -->
    <div class="editor-zone" id="canvasWrapper">
      <div class="hint-overlay">Кликните на кромку детали, чтобы выбрать линию гиба</div>
      <canvas id="flatCanvas"></canvas>
    </div>

    <!-- Панель управления -->
    <div class="controls-zone">
      <div class="card">
        <h3>1. Форма основания</h3>
        <select id="baseShapeSel">
          <option value="rect">Квадрат (Коробка)</option>
          <option value="hex">Шестигранник</option>
          <option value="triangle">Треугольник</option>
        </select>
        <button id="btnReset" class="danger">Сбросить деталь</button>
      </div>

      <div class="card">
        <h3>2. Параметры гиба (Отгиб)</h3>
        <p style="font-size:0.75rem; color:#aaa; margin-bottom:8px;">Выбрана кромка: <strong id="lblEdge" style="color:#fff;">#0</strong></p>
        
        <div class="grid-2">
          <div>
            <label>Длина полки (мм)</label>
            <input type="number" id="inpLength" value="50" min="10" max="200">
          </div>
          <div>
            <label>Угол (°)</label>
            <input type="number" id="inpAngle" value="90" min="-180" max="180">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Пуансон</label>
            <select id="inpPunch"><option>Прямой</option><option>Гусь</option></select>
          </div>
          <div>
            <label>Матрица</label>
            <select id="inpDie"><option>V=16</option><option>V=12</option></select>
          </div>
        </div>

        <button id="btnAddBend">Добавить гиб (Фланец)</button>
      </div>

      <div class="card" style="flex:1;">
        <h3>Операции</h3>
        <ul id="opList" style="list-style:none; font-size:0.75rem; color:#aaa; font-family:monospace; line-height:1.6;"></ul>
      </div>
    </div>
  </div>

  <!-- Модальное окно 3D -->
  <div id="modal3d">
    <header>
      <h2 style="color:#fff; font-size:1rem;">3D Просмотр (Вращайте пальцем)</h2>
      <button id="btnClose3D" class="danger">Закрыть</button>
    </header>
    <div id="container3d"></div>
  </div>

  <script>
    // --- ДАННЫЕ ПРОЕКТА ---
    let baseShapeType = 'rect'; // rect, hex, triangle
    let basePoints = []; // Точки базового многоугольника
    let flanges = []; // { edgeIdx, length, angle }
    let selectedEdge = 0;

    // --- 2D CANVAS (РАЗВЁРТКА) ---
    const canvas = document.getElementById('flatCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    function resizeCanvas() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      draw2D();
    }
    window.addEventListener('resize', resizeCanvas);

    function initBaseShape() {
      basePoints = [];
      flanges = [];
      selectedEdge = 0;
      updateOpList();

      if (baseShapeType === 'rect') {
        basePoints = [[-60, -60], [60, -60], [60, 60], [-60, 60]];
      } else if (baseShapeType === 'hex') {
        for (let i = 0; i < 6; i++) {
          let a = i * Math.PI / 3;
          basePoints.push([70 * Math.cos(a), 70 * Math.sin(a)]);
        }
      } else if (baseShapeType === 'triangle') {
        for (let i = 0; i < 3; i++) {
          let a = i * (Math.PI * 2 / 3) - Math.PI/2;
          basePoints.push([80 * Math.cos(a), 80 * Math.sin(a)]);
        }
      }
      draw2D();
    }

    function draw2D() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const scale = 1.5;

      // Отрисовка фланцев (развернутых)
      flanges.forEach(f => {
        const p1 = basePoints[f.edgeIdx];
        const p2 = basePoints[(f.edgeIdx + 1) % basePoints.length];
        
        // Вектор кромки
        const dx = p2[0] - p1[0];
        const dy = p2[1] - p1[1];
        
        // Нормаль наружу (поворот на -90 град для экрана)
        const len = Math.hypot(dx, dy);
        const nx = -dy / len;
        const ny = dx / len;

        const flen = f.length;
        
        // Точки фланца
        const f1 = [p2[0], p2[1]];
        const f2 = [p1[0], p1[1]];
        const f3 = [p1[0] + nx * flen, p1[1] + ny * flen];
        const f4 = [p2[0] + nx * flen, p2[1] + ny * flen];

        ctx.fillStyle = 'rgba(77, 166, 255, 0.4)'; // Полупрозрачный синий
        ctx.strokeStyle = '#4da6ff';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(cx + f1[0]*scale, cy + f1[1]*scale);
        ctx.lineTo(cx + f2[0]*scale, cy + f2[1]*scale);
        ctx.lineTo(cx + f3[0]*scale, cy + f3[1]*scale);
        ctx.lineTo(cx + f4[0]*scale, cy + f4[1]*scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });

      // Отрисовка базовой детали
      ctx.fillStyle = '#282833';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx + basePoints[0][0]*scale, cy + basePoints[0][1]*scale);
      for (let i = 1; i < basePoints.length; i++) {
        ctx.lineTo(cx + basePoints[i][0]*scale, cy + basePoints[i][1]*scale);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Отрисовка кромок гиба
      for (let i = 0; i < basePoints.length; i++) {
        const p1 = basePoints[i];
        const p2 = basePoints[(i + 1) % basePoints.length];
        
        ctx.beginPath();
        ctx.moveTo(cx + p1[0]*scale, cy + p1[1]*scale);
        ctx.lineTo(cx + p2[0]*scale, cy + p2[1]*scale);
        
        if (i === selectedEdge) {
          ctx.strokeStyle = '#ff4d4d'; // Красная линия для выбранной кромки
          ctx.lineWidth = 5;
        } else {
          ctx.strokeStyle = '#888';
          ctx.lineWidth = 2;
        }
        ctx.stroke();

        // Центр кромки (для клика)
        const mx = cx + ((p1[0] + p2[0]) / 2) * scale;
        const my = cy + ((p1[1] + p2[1]) / 2) * scale;
        
        if(i === selectedEdge) {
          ctx.fillStyle = '#ff4d4d';
          ctx.beginPath();
          ctx.arc(mx, my, 6, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }

    // Обработка клика по 2D холсту для выбора кромки
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const scale = 1.5;

      let minDist = Infinity;
      let closestEdge = 0;

      for (let i = 0; i < basePoints.length; i++) {
        const p1 = basePoints[i];
        const p2 = basePoints[(i + 1) % basePoints.length];
        
        const mx = cx + ((p1[0] + p2[0]) / 2) * scale;
        const my = cy + ((p1[1] + p2[1]) / 2) * scale;

        const dist = Math.hypot(clickX - mx, clickY - my);
        if (dist < minDist) {
          minDist = dist;
          closestEdge = i;
        }
      }

      if (minDist < 40) { // Радиус захвата клика
        selectedEdge = closestEdge;
        document.getElementById('lblEdge').textContent = `#${selectedEdge}`;
        draw2D();
        if(window.Telegram?.WebApp?.HapticFeedback) {
           window.Telegram.WebApp.HapticFeedback.selectionChanged();
        }
      }
    });

    // --- UI ЛОГИКА ---
    document.getElementById('baseShapeSel').addEventListener('change', (e) => {
      baseShapeType = e.target.value;
      initBaseShape();
    });

    document.getElementById('btnReset').addEventListener('click', initBaseShape);

    document.getElementById('btnAddBend').addEventListener('click', () => {
      const len = parseFloat(document.getElementById('inpLength').value);
      const ang = parseFloat(document.getElementById('inpAngle').value);

      // Проверка: есть ли уже фланец на этой кромке
      const existingIdx = flanges.findIndex(f => f.edgeIdx === selectedEdge);
      if (existingIdx !== -1) {
        flanges[existingIdx] = { edgeIdx: selectedEdge, length: len, angle: ang };
      } else {
        flanges.push({ edgeIdx: selectedEdge, length: len, angle: ang });
      }

      updateOpList();
      draw2D();
      
      if(window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      }
    });

    function updateOpList() {
      const ul = document.getElementById('opList');
      ul.innerHTML = '';
      flanges.forEach((f, i) => {
        const li = document.createElement('li');
        li.textContent = `Гиб ${i+1}: Кромка #${f.edgeIdx} | L=${f.length} | ∠${f.angle}°`;
        ul.appendChild(li);
      });
    }

    // --- THREE.JS (3D РЕНДЕР) ---
    let scene, camera, renderer, controls, sheetGroup;

    function init3D() {
      const container = document.getElementById('container3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x181822);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
      camera.position.set(150, -200, 150);
      camera.up.set(0, 0, 1); // Z - вверх

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Освещение
      const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(100, 100, 200);
      scene.add(dirLight);

      // Сетка
      const grid = new THREE.GridHelper(400, 20, 0x444455, 0x222233);
      grid.rotation.x = Math.PI / 2;
      scene.add(grid);

      sheetGroup = new THREE.Group();
      scene.add(sheetGroup);

      animate3D();
    }

    function build3DModel() {
      // Очистка старой модели
      while(sheetGroup.children.length > 0){ 
          sheetGroup.remove(sheetGroup.children[0]); 
      }

      const material = new THREE.MeshStandardMaterial({ 
        color: 0x82b1ff, 
        metalness: 0.6, 
        roughness: 0.4,
        side: THREE.DoubleSide 
      });

      // 1. Строим базу
      const shape = new THREE.Shape();
      shape.moveTo(basePoints[0][0], basePoints[0][1]);
      for (let i = 1; i < basePoints.length; i++) {
        shape.lineTo(basePoints[i][0], basePoints[i][1]);
      }
      const baseGeo = new THREE.ShapeGeometry(shape);
      const baseMesh = new THREE.Mesh(baseGeo, material);
      sheetGroup.add(baseMesh);

      // 2. Строим фланцы
      flanges.forEach(f => {
        const p1 = basePoints[f.edgeIdx];
        const p2 = basePoints[(f.edgeIdx + 1) % basePoints.length];
        
        const dx = p2[0] - p1[0];
        const dy = p2[1] - p1[1];
        const width = Math.hypot(dx, dy);
        const alpha = Math.atan2(dy, dx);

        // Шарнир (Pivot) на стартовой точке кромки
        const pivot = new THREE.Group();
        pivot.position.set(p1[0], p1[1], 0);
        pivot.rotation.z = alpha; // Выравниваем ось X по кромке
        
        // Геометрия фланца. Сдвигаем, чтобы нижний край был на оси X
        const flen = f.length;
        const flangeGeo = new THREE.PlaneGeometry(width, flen);
        flangeGeo.translate(width/2, -flen/2, 0); // В Three.js Y идет вверх в локальных, нам нужно наружу

        const flangeMesh = new THREE.Mesh(flangeGeo, material);
        
        // Гиб: Вращение шарнира вокруг локальной оси X
        // Положительный угол загибает "вверх" (по оси Z)
        pivot.rotation.x = f.angle * Math.PI / 180;

        pivot.add(flangeMesh);
        sheetGroup.add(pivot);
      });
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      controls.update();
      renderer.render(scene, camera);
    }

    // --- УПРАВЛЕНИЕ ОКНОМ 3D ---
    document.getElementById('btnOpen3D').addEventListener('click', () => {
      document.getElementById('modal3d').style.display = 'flex';
      if(!scene) init3D();
      build3DModel();
    });

    document.getElementById('btnClose3D').addEventListener('click', () => {
      document.getElementById('modal3d').style.display = 'none';
    });

    // --- СТАРТ ---
    setTimeout(() => {
      resizeCanvas();
      initBaseShape();
    }, 100);
  </script>
</body>
</html>
