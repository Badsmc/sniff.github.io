<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SheetMetal 3D Simulator</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js для 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls для вращения 3D модели -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <h1>SheetMetal 3D</h1>
    <button id="btnOpen3D" class="success btn-header">Показать 3D Модель</button>
  </header>

  <div class="app-container">
    <!-- Зона 2D Развёртки -->
    <div class="editor-zone" id="canvasWrapper">
      <div class="hint-overlay">Кликните на кромку детали, чтобы выбрать линию гиба</div>
      <!-- Холст для рисования -->
      <canvas id="flatCanvas"></canvas>
    </div>

    <!-- Панель управления -->
    <div class="controls-zone">
      <div class="card">
        <h3>1. Форма основания</h3>
        <select id="baseShapeSel">
          <!-- Заполняется динамически из data.json -->
        </select>
        <button id="btnReset" class="danger">Сбросить деталь</button>
      </div>

      <div class="card">
        <h3>2. Параметры гиба (Отгиб)</h3>
        <p class="edge-info">Выбрана кромка: <strong id="lblEdge">#0</strong></p>
        
        <div class="grid-2">
          <div>
            <label>Длина полки (мм)</label>
            <input type="number" id="inpLength" value="50" min="10" max="200" inputmode="numeric">
          </div>
          <div>
            <label>Угол (°)</label>
            <input type="number" id="inpAngle" value="90" min="-180" max="180" inputmode="numeric">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Пуансон</label>
            <select id="inpPunch"></select>
          </div>
          <div>
            <label>Матрица</label>
            <select id="inpDie"></select>
          </div>
        </div>

        <button id="btnAddBend">Добавить гиб (Фланец)</button>
      </div>

      <div class="card op-card">
        <h3>Операции</h3>
        <ul id="opList"></ul>
      </div>
    </div>
  </div>

  <!-- Модальное окно 3D -->
  <div id="modal3d">
    <header>
      <h2>3D Просмотр (Вращайте пальцем)</h2>
      <button id="btnClose3D" class="danger btn-header">Закрыть</button>
    </header>
    <div id="container3d"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
