<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheet Metal Bending CAD & Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181c;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #23232b;
      padding: 10px 20px;
      border-bottom: 1px solid #383845;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 1.1rem; color: #4da6ff; }
    
    .level-badge {
      background: #383845;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #00e676;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #101014;
      position: relative;
    }

    .blueprint-card {
      background: #1a233a;
      border: 1px solid #2a3b63;
      padding: 12px 16px;
      margin: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .blueprint-card h2 {
      font-size: 0.95rem;
      color: #82b1ff;
      margin-bottom: 6px;
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background: #141418;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .controls-panel {
      width: 360px;
      background: #202028;
      border-left: 1px solid #383845;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .panel-section {
      background: #282833;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #383845;
    }

    .panel-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9e9ea6;
      margin-bottom: 10px;
    }

    label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #ccc; }
    
    select, input, button {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      border: 1px solid #48485a;
      background: #18181c;
      color: #fff;
      font-size: 0.85rem;
    }

    button {
      background: #0066cc;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0052a3; }
    button.success { background: #2e7d32; }
    button.success:hover { background: #1b5e20; }
    button.secondary { background: #48485a; }

    .history-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.75rem;
      font-family: monospace;
    }

    .history-list li {
      padding: 3px 6px;
      border-bottom: 1px solid #383845;
    }

    .phase-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .phase-tab {
      flex: 1;
      padding: 6px;
      text-align: center;
      font-size: 0.75rem;
      background: #18181c;
      border: 1px solid #383845;
      border-radius: 4px;
      color: #777;
    }

    .phase-tab.active {
      background: #0066cc;
      color: #fff;
      border-color: #0066cc;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sheet Metal CNC Simulator</h1>
    <div id="levelBadge" class="level-badge">Уровень 1</div>
  </header>

  <div class="main-container">
    <div class="view-container">
      <!-- ТЗ Уровня -->
      <div class="blueprint-card">
        <h2 id="taskTitle">Чертеж детали</h2>
        <p id="taskDesc">Загрузка...</p>
      </div>

      <!-- Область визуализации -->
      <div class="canvas-wrapper">
        <canvas id="simCanvas" width="720" height="460"></canvas>
      </div>
    </div>

    <!-- Управление -->
    <div class="controls-panel">
      
      <div class="phase-indicator">
        <div id="tabFlat" class="phase-tab active">1. Развёртка (CAD)</div>
        <div id="tabBend" class="phase-tab">2. Гибка (Press)</div>
      </div>

      <!-- ФАЗА 1: Редактирование развёртки -->
      <div id="sectionFlat" class="panel-section">
        <h3>Параметры заготовки</h3>
        <label>Левая полка L1 (мм):</label>
        <input type="number" id="flatL1" value="60" min="20" max="150">

        <label>Основание L2 (мм):</label>
        <input type="number" id="flatL2" value="100" min="40" max="200">

        <label>Правая полка L3 (мм):</label>
        <input type="number" id="flatL3" value="60" min="20" max="150">

        <button id="btnConfirmFlat" class="success">Утвердить развёртку и перейти к гибке</button>
      </div>

      <!-- ФАЗА 2: Настройка гибки (скрыто по умолчанию) -->
      <div id="sectionBend" style="display:none;">
        <div class="panel-section">
          <h3>1. Оснастка</h3>
          <label>Пуансон:</label>
          <select id="punchSelect">
            <option value="straight">Прямой (Straight)</option>
            <option value="gooseneck">Гусиная шея (Gooseneck)</option>
            <option value="acute">Острый (Acute 30°)</option>
          </select>

          <label>Матрица:</label>
          <select id="dieSelect">
            <option value="v_standard">Стандартная V-матрица</option>
          </select>
        </div>

        <div class="panel-section">
          <h3>2. Операция гибки</h3>
          <label>Линия гиба:</label>
          <select id="bendLineSelect">
            <option value="0">Гиб #1 (Левый)</option>
            <option value="1">Гиб #2 (Правый)</option>
          </select>

          <label>Целевой угол (°):</label>
          <input type="number" id="angleInput" value="90" min="10" max="180">

          <button id="btnBend">Выполнить гиб</button>
        </div>
      </div>

      <div class="panel-section">
        <button id="btnReset" class="secondary">Сбросить текущий шаг</button>
      </div>

      <div class="panel-section" style="flex:1;">
        <h3>Журнал операций</h3>
        <ul id="history" class="history-list"></ul>
      </div>
    </div>
  </div>

  <script>
    // --- ДАННЫЕ УРОВНЕЙ ---
    const LEVELS = [
      {
        id: 1,
        title: "Уровень 1: Прямой П-образный профиль",
        desc: "Создайте развёртку L1=70, L2=120, L3=70. Согните Гиб #1 на 90° и Гиб #2 на 90°. Порядок любой.",
        targetFlat: [70, 120, 70],
        targetAngles: [90, 90]
      },
      {
        id: 2,
        title: "Уровень 2: Z-профиль с обходом инструмента",
        desc: "Развёртка: L1=80, L2=100, L3=80. Согните Гиб #1 на 90°. При гибке #2 на 90° обычный пуансон столкнётся с полкой — используйте 'Гусиную шею'!",
        targetFlat: [80, 100, 80],
        targetAngles: [90, 90]
      },
      {
        id: 3,
        title: "Уровень 3: Догибка замкнутого контура",
        desc: "Развёртка: L1=90, L2=110, L3=90. Технология: сначала предварительно согните Гиб #1 на 45°, затем согните Гиб #2 на 90°, и завершите догибкой Гиба #1 до 90°.",
        targetFlat: [90, 110, 90],
        targetAngles: [90, 90]
      }
    ];

    let currentLevelIdx = 0;
    let currentPhase = 'flat'; // 'flat' или 'bend'

    // Состояние детали
    let sheet = {
      lengths: [60, 100, 60],
      angles: [0, 0]
    };

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // --- ИНИЦИАЛИЗАЦИЯ И ИНТЕРФЕЙС ---
    function loadLevel(idx) {
      currentLevelIdx = idx;
      const lvl = LEVELS[idx];
      
      document.getElementById('levelBadge').textContent = `Уровень ${lvl.id}`;
      document.getElementById('taskTitle').textContent = lvl.title;
      document.getElementById('taskDesc').textContent = lvl.desc;

      // Сброс фазы
      setPhase('flat');
      document.getElementById('history').innerHTML = '';
      sheet.angles = [0, 0];
      
      // Установка значения по умолчанию для развёртки
      document.getElementById('flatL1').value = lvl.targetFlat[0];
      document.getElementById('flatL2').value = lvl.targetFlat[1];
      document.getElementById('flatL3').value = lvl.targetFlat[2];
      updateFlatFromInputs();
    }

    function setPhase(phase) {
      currentPhase = phase;
      if (phase === 'flat') {
        document.getElementById('tabFlat').classList.add('active');
        document.getElementById('tabBend').classList.remove('active');
        document.getElementById('sectionFlat').style.display = 'block';
        document.getElementById('sectionBend').style.display = 'none';
      } else {
        document.getElementById('tabBend').classList.add('active');
        document.getElementById('tabFlat').classList.remove('active');
        document.getElementById('sectionFlat').style.display = 'none';
        document.getElementById('sectionBend').style.display = 'block';
      }
      render();
    }

    function updateFlatFromInputs() {
      sheet.lengths[0] = parseFloat(document.getElementById('flatL1').value) || 0;
      sheet.lengths[1] = parseFloat(document.getElementById('flatL2').value) || 0;
      sheet.lengths[2] = parseFloat(document.getElementById('flatL3').value) || 0;
      render();
    }

    document.getElementById('flatL1').addEventListener('input', updateFlatFromInputs);
    document.getElementById('flatL2').addEventListener('input', updateFlatFromInputs);
    document.getElementById('flatL3').addEventListener('input', updateFlatFromInputs);

    // Утверждение развёртки
    document.getElementById('btnConfirmFlat').addEventListener('click', () => {
      const lvl = LEVELS[currentLevelIdx];
      const match = sheet.lengths.every((val, i) => Math.abs(val - lvl.targetFlat[i]) < 0.1);

      if (!match) {
        alert(`Ошибка в чертеже! Размеры развёртки должны быть: L1=${lvl.targetFlat[0]}, L2=${lvl.targetFlat[1]}, L3=${lvl.targetFlat[2]}`);
        return;
      }

      alert("Развёртка утверждена! Переход к гибочному прессу.");
      setPhase('bend');
    });

    // --- ОТРИСОВКА (DRAWING) ---
    function drawPunch(type, x, y) {
      ctx.save();
      ctx.fillStyle = '#78788c';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();

      if (type === 'straight') {
        ctx.moveTo(x - 15, y - 140);
        ctx.lineTo(x + 15, y - 140);
        ctx.lineTo(x + 15, y - 25);
        ctx.lineTo(x + 2, y);
        ctx.lineTo(x - 2, y);
        ctx.lineTo(x - 15, y - 25);
      } else if (type === 'gooseneck') {
        ctx.moveTo(x - 15, y - 140);
        ctx.lineTo(x + 15, y - 140);
        ctx.lineTo(x + 15, y - 80);
        ctx.lineTo(x + 55, y - 55);
        ctx.lineTo(x + 55, y - 25);
        ctx.lineTo(x + 2, y);
        ctx.lineTo(x - 2, y);
        ctx.lineTo(x - 15, y - 25);
      } else if (type === 'acute') {
        ctx.moveTo(x - 25, y - 140);
        ctx.lineTo(x + 25, y - 140);
        ctx.lineTo(x + 2, y);
        ctx.lineTo(x - 2, y);
      }

      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawDie(x, y) {
      ctx.save();
      ctx.fillStyle = '#484858';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - 70, y + 100);
      ctx.lineTo(x - 70, y);
      ctx.lineTo(x - 20, y);
      ctx.lineTo(x, y + 25);
      ctx.lineTo(x + 20, y);
      ctx.lineTo(x + 70, y);
      ctx.lineTo(x + 70, y + 100);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function getSheetPoints() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 + 20;

      const p1 = { x: centerX - sheet.lengths[1] / 2, y: centerY };
      const p2 = { x: centerX + sheet.lengths[1] / 2, y: centerY };

      const rad1 = (sheet.angles[0] * Math.PI) / 180;
      const p0 = {
        x: p1.x - sheet.lengths[0] * Math.cos(rad1),
        y: p1.y - sheet.lengths[0] * Math.sin(rad1)
      };

      const rad2 = (sheet.angles[1] * Math.PI) / 180;
      const p3 = {
        x: p2.x + sheet.lengths[2] * Math.cos(rad2),
        y: p2.y - sheet.lengths[2] * Math.sin(rad2)
      };

      return [p0, p1, p2, p3];
    }

    function renderFlatCAD() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.save();
      ctx.strokeStyle = '#4da6ff';
      ctx.lineWidth = 4;

      const totalLen = sheet.lengths[0] + sheet.lengths[1] + sheet.lengths[2];
      const startX = centerX - totalLen / 2;

      // Отрисовка полосы развёртки
      ctx.beginPath();
      ctx.moveTo(startX, centerY);
      ctx.lineTo(startX + totalLen, centerY);
      ctx.stroke();

      // Линии гиба
      ctx.strokeStyle = '#ff3344';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);

      const line1X = startX + sheet.lengths[0];
      const line2X = line1X + sheet.lengths[1];

      ctx.beginPath();
      ctx.moveTo(line1X, centerY - 25); ctx.lineTo(line1X, centerY + 25);
      ctx.moveTo(line2X, centerY - 25); ctx.lineTo(line2X, centerY + 25);
      ctx.stroke();

      // Подписи размеров
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`L1: ${sheet.lengths[0]}`, startX + sheet.lengths[0] / 2, centerY - 15);
      ctx.fillText(`L2: ${sheet.lengths[1]}`, line1X + sheet.lengths[1] / 2, centerY - 15);
      ctx.fillText(`L3: ${sheet.lengths[2]}`, line2X + sheet.lengths[2] / 2, centerY - 15);

      ctx.restore();
    }

    function renderBending() {
      const punchType = document.getElementById('punchSelect').value;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 + 20;

      drawDie(centerX, centerY);

      const pts = getSheetPoints();
      ctx.save();
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.lineTo(pts[2].x, pts[2].y);
      ctx.lineTo(pts[3].x, pts[3].y);
      ctx.stroke();
      ctx.restore();

      drawPunch(punchType, centerX, centerY - 8);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (currentPhase === 'flat') {
        renderFlatCAD();
      } else {
        renderBending();
      }
    }

    // --- ЛОГИКА ГИБКИ И ПРОВЕРКИ ---
    function checkCollision(punchType) {
      // Коллизия с прямым пуансоном при глубокой полке
      if (punchType === 'straight') {
        if (sheet.angles[0] > 60 || sheet.angles[1] > 60) {
          return "СТОЛКНОВЕНИЕ: Полка врезалась в корпус прямого пуансона! Используйте 'Гусиную шею'.";
        }
      }
      return null;
    }

    document.getElementById('btnBend').addEventListener('click', () => {
      const lineIndex = parseInt(document.getElementById('bendLineSelect').value);
      const angle = parseFloat(document.getElementById('angleInput').value);
      const punchType = document.getElementById('punchSelect').value;

      const prevAngle = sheet.angles[lineIndex];
      sheet.angles[lineIndex] = angle;

      const collision = checkCollision(punchType);

      if (collision) {
        alert(collision);
        sheet.angles[lineIndex] = prevAngle; // Откат
      } else {
        const logItem = `Гиб #${lineIndex + 1}: ${angle}° (${punchType})`;
        const ul = document.getElementById('history');
        const li = document.createElement('li');
        li.textContent = logItem;
        ul.appendChild(li);

        checkLevelWin();
      }

      render();
    });

    function checkLevelWin() {
      const lvl = LEVELS[currentLevelIdx];
      const win = sheet.angles.every((a, idx) => Math.abs(a - lvl.targetAngles[idx]) < 0.1);

      if (win) {
        setTimeout(() => {
          alert(`Уровень ${lvl.id} успешно пройден!`);
          if (currentLevelIdx + 1 < LEVELS.length) {
            loadLevel(currentLevelIdx + 1);
          } else {
            alert("Поздравляем! Вы прошли все уровни симулятора.");
          }
        }, 100);
      }
    }

    document.getElementById('btnReset').addEventListener('click', () => {
      loadLevel(currentLevelIdx);
    });

    document.getElementById('punchSelect').addEventListener('change', render);
    document.getElementById('dieSelect').addEventListener('change', render);

    // Старт игры
    loadLevel(0);
  </script>
</body>
</html>
