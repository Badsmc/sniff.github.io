<div class="card">
  <h3>2. Параметры гиба (Отгиб)</h3>
  <p class="edge-info">Выбрана кромка: <strong id="lblEdge">#0</strong></p>
  
  <div class="grid-2">
    <div>
      <label>Длина полки (мм)</label>
      <input type="number" id="inpLength" value="50" min="5" max="300" inputmode="numeric">
    </div>
    <div>
      <label>Угол (°)</label>
      <div class="angle-input-group">
        <input type="number" id="inpAngle" value="90" min="-180" max="180" inputmode="numeric">
        <button type="button" id="btnToggleSign" class="btn-sm">±</button>
      </div>
    </div>
  </div>

  <!-- Быстрые пресеты углов -->
  <div class="angle-presets">
    <button type="button" onclick="setAngle(-90)" class="btn-preset">-90°</button>
    <button type="button" onclick="setAngle(-45)" class="btn-preset">-45°</button>
    <button type="button" onclick="setAngle(45)" class="btn-preset">45°</button>
    <button type="button" onclick="setAngle(90)" class="btn-preset">90°</button>
  </div>

  <div class="grid-2">
    <div>
      <label>Пуансон</label>
      <select id="inpPunch"></select>
    </div>
    <div>
      <label>Матрица</label>
      <select id="inpDie"></select>
    </div>
  </div>

  <button id="btnAddBend">Добавить гиб (Фланец)</button>
</div>
