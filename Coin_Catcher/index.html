<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Market Maker & Trader Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="header">
        <div class="stats-row">
            <span id="day-counter">День: 1</span>
            <span id="net-worth">Капитал: $1000</span>
        </div>
        <div id="news-ticker">Рынок стабилен</div>
    </div>
    
    <canvas id="chartCanvas"></canvas>
    
    <!-- Панель трейдера -->
    <div id="trader-panel" class="panel">
        <div class="panel-title">Ваш портфель</div>
        <div class="portfolio-stats">
            <div>USD: <span id="usd-balance">1000.0</span></div>
            <div>Актив: <span id="asset-balance">0</span> шт</div>
        </div>
        <div class="buttons">
            <button id="btn-buy" class="btn blue">КУПИТЬ 🛒</button>
            <button id="btn-sell" class="btn orange">ПРОДАТЬ 💰</button>
        </div>
    </div>

    <!-- Панель маркетмейкера -->
    <div id="mm-panel" class="panel">
        <div class="panel-title">Бюджет ММ (обновляется 1 раз в день)</div>
        <div class="energy-bar"><div id="energy-fill"></div></div>
        <div class="buttons">
            <button id="btn-dump" class="btn red">DUMP 📉</button>
            <button id="btn-pump" class="btn green">PUMP 📈</button>
        </div>
    </div>

    <!-- Всплывающее окно новостей -->
    <div id="news-modal" class="modal hidden">
        <div class="modal-content">
            <h3>СРОЧНАЯ НОВОСТЬ</h3>
            <p id="news-modal-text">Текст новости</p>
            <button id="btn-continue" class="btn blue">Понятно</button>
        </div>
    </div>

    <!-- Экран проигрыша -->
    <div id="game-over" class="modal hidden">
        <div class="modal-content">
            <h2>Рынок рухнул!</h2>
            <div id="final-score">Прожито дней: 0</div>
            <div id="final-money">Итоговый капитал: $0</div>
            <button id="btn-restart" class="btn green">Играть снова</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
