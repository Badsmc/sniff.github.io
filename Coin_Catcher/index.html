<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ловец Монет / Coin Catcher</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #1e1e1e; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            touch-action: none; 
            overflow: hidden; 
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 0 20px; 
            box-sizing: border-box; 
            z-index: 10; 
            pointer-events: none; 
        }
        #scoreText { 
            font-size: 22px; 
            font-weight: bold; 
            text-shadow: 1px 1px 2px #000;
        }
        .lang-btn { 
            pointer-events: auto; 
            background: #444; 
            color: white; 
            border: 1px solid #666; 
            padding: 5px 12px; 
            cursor: pointer; 
            border-radius: 4px; 
            margin-left: 5px;
        }
        .lang-btn:active { background: #666; }
        canvas { 
            background: #2b2b2b; 
            display: block; 
            width: 100%; 
            max-width: 400px; 
            height: 100vh;
            max-height: 600px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); 
        }
        #menu { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 250px;
        }
        #titleText { margin-top: 0; }
        button.start { 
            font-size: 18px; 
            font-weight: bold;
            padding: 12px 25px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%;
        }
        button.start:active { background: #45a049; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="scoreText">Счет: 0</div>
        <div>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
            <button class="lang-btn" onclick="setLang('ru')">RU</button>
        </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="menu">
        <h2 id="titleText">Ловец Монет</h2>
        <p id="gameOverText" style="display:none; color:#ff5555; font-weight:bold; margin: 10px 0;">Игра окончена!</p>
        <button class="start" id="startBtn" onclick="startGame()">Начать игру</button>
    </div>

    <script>
        // Словари для локализации
        const i18n = {
            en: { score: "Score: ", title: "Coin Catcher", over: "Game Over!", start: "Start Game", restart: "Try Again" },
            ru: { score: "Счет: ", title: "Ловец Монет", over: "Игра окончена!", start: "Начать игру", restart: "Играть снова" }
        };
        let currentLang = 'ru';

        // Элементы DOM
        const scoreText = document.getElementById('scoreText');
        const titleText = document.getElementById('titleText');
        const gameOverText = document.getElementById('gameOverText');
        const startBtn = document.getElementById('startBtn');
        const menu = document.getElementById('menu');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Переключение языка
        function setLang(lang) {
            currentLang = lang;
            updateUI();
        }

        function updateUI() {
            scoreText.innerText = i18n[currentLang].score + score;
            titleText.innerText = i18n[currentLang].title;
            gameOverText.innerText = i18n[currentLang].over;
            startBtn.innerText = isGameOver ? i18n[currentLang].restart : i18n[currentLang].start;
        }

        // Состояние игры
        let score = 0;
        let isPlaying = false;
        let isGameOver = false;
        let player = { x: 160, y: 550, w: 80, h: 15 };
        let items = [];
        let frameId;
        let difficulty = 1;
        let mouseX = 200;

        // Обработка ввода (мышь и сенсор)
        function handleInput(e) {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            // Корректировка координат с учетом масштабирования CSS
            const scaleX = canvas.width / rect.width; 
            mouseX = (clientX - rect.left) * scaleX;
        }

        canvas.addEventListener('mousemove', handleInput);
        canvas.addEventListener('touchmove', (e) => { 
            e.preventDefault(); // Блокировка прокрутки экрана
            handleInput(e); 
        }, { passive: false });

        // Генерация объектов
        function spawnItem() {
            if (Math.random() < 0.04 * difficulty) {
                const isBomb = Math.random() < 0.35; // 35% шанс появления бомбы
                items.push({
                    x: Math.random() * (canvas.width - 24) + 12,
                    y: -20,
                    r: 12,
                    type: isBomb ? 'bomb' : 'coin',
                    speed: (3 + Math.random() * 2) * difficulty
                });
            }
        }

        // Управление циклом
        function startGame() {
            score = 0;
            difficulty = 1;
            items = [];
            isPlaying = true;
            isGameOver = false;
            player.x = canvas.width / 2 - player.w / 2;
            mouseX = canvas.width / 2;
            
            menu.style.display = 'none';
            gameOverText.style.display = 'none';
            updateUI();
            
            if (frameId) cancelAnimationFrame(frameId);
            loop();
        }

        function stopGame() {
            isPlaying = false;
            isGameOver = true;
            menu.style.display = 'block';
            gameOverText.style.display = 'block';
            updateUI();
        }

        // Логика
        function update() {
            // Плавное движение платформы за курсором/пальцем
            player.x += (mouseX - player.x - player.w / 2) * 0.25;
            
            // Ограничение выхода за границы
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            spawnItem();
            difficulty += 0.0005; // Постепенное увеличение скорости и частоты

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Проверка столкновений (AABB vs Circle)
                const closestX = Math.max(player.x, Math.min(item.x, player.x + player.w));
                const closestY = Math.max(player.y, Math.min(item.y, player.y + player.h));
                const distanceX = item.x - closestX;
                const distanceY = item.y - closestY;
                const distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

                if (distanceSquared < (item.r * item.r)) {
                    if (item.type === 'bomb') {
                        stopGame(); // Поймал бомбу — проиграл
                        return;
                    } else {
                        score += 10; // Поймал монету
                        items.splice(i, 1);
                        updateUI();
                        continue;
                    }
                }

                // Проверка выхода за нижнюю границу экрана
                if (item.y - item.r > canvas.height) {
                    if (item.type === 'coin') {
                        stopGame(); // Упустил монету — проиграл
                        return;
                    }
                    items.splice(i, 1); // Бомбы можно пропускать
                }
            }
        }

        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Платформа
            ctx.fillStyle = '#4CAFE8';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.w, player.h, 5);
            ctx.fill();

            // Объекты
            items.forEach(item => {
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
                ctx.fillStyle = item.type === 'bomb' ? '#F44336' : '#FFD700';
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            });
        }

        // Игровой цикл
        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            frameId = requestAnimationFrame(loop);
        }

        // Инициализация
        setLang(currentLang);
    </script>
</body>
</html>
