<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Market Maker Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="header">
        <div id="score">Время: 0s</div>
        <div id="news-ticker">Ожидание новостей...</div>
    </div>
    
    <canvas id="chartCanvas"></canvas>
    
    <div id="controls">
        <div class="energy-bar"><div id="energy-fill"></div></div>
        <div class="buttons">
            <button id="btn-dump" class="btn red">DUMP 📉</button>
            <button id="btn-pump" class="btn green">PUMP 📈</button>
        </div>
    </div>

    <div id="game-over" class="hidden">
        <h2>Рынок рухнул!</h2>
        <div id="final-score">Время: 0s</div>
        <button id="btn-restart">Играть снова</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
