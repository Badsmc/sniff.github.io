<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silence the Sax</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #2c3e50; overflow: hidden; font-family: sans-serif; touch-action: none; user-select: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; box-sizing: border-box; z-index: 5; pointer-events: none; }
        .stats { color: white; font-weight: bold; font-size: 20px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        #stressBarContainer { width: 100%; height: 20px; background: #555; border-radius: 10px; overflow: hidden; border: 2px solid #fff; }
        #stressBar { height: 100%; width: 0%; background: #e74c3c; transition: width 0.1s linear; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        h1 { color: #e74c3c; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; max-width: 400px; margin: 10px 0; }
        .rules { text-align: left; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #3498db; color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 8px; cursor: pointer; font-weight: bold; width: 80%; max-width: 300px; pointer-events: auto; }
        button:active { transform: scale(0.95); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui" class="hidden">
        <div class="stats">
            <span>Счет: <span id="score">0</span></span>
            <span>Стресс!</span>
        </div>
        <div id="stressBarContainer"><div id="stressBar"></div></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="overlay">
        <h1>Silence the Sax</h1>
        <div class="rules">
            <p><strong>Смысл:</strong> Не дай громкому саксофону довести тебя до нервного срыва.</p>
            <p><strong>Правила:</strong><br>🎷 Саксофоны растут и повышают стресс.<br>📈 Шкала заполнится — конец игры.</p>
            <p><strong>Как играть:</strong> Быстро тапай по саксофонам, чтобы заглушить их.</p>
        </div>
        <button id="startBtn">Старт</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>Нервный срыв!</h1>
        <p>Музыка стала слишком громкой.</p>
        <p style="font-size: 1.5em; color: #3498db;">Счет: <span id="finalScore">0</span></p>
        <button id="restartBtn">Повторить</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const screens = {
            start: document.getElementById('startScreen'),
            over: document.getElementById('gameOverScreen'),
            ui: document.getElementById('ui')
        };
        const stressBar = document.getElementById('stressBar');
        
        let width, height, saxophones, score, stress, isPlaying, spawnTimer;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function init() {
            saxophones = [];
            score = 0;
            stress = 0;
            isPlaying = true;
            spawnTimer = 0;
            document.getElementById('score').textContent = score;
            stressBar.style.width = '0%';
            requestAnimationFrame(update);
        }

        function spawnSax() {
            const maxR = Math.min(width, height) * 0.2;
            saxophones.push({
                x: maxR + Math.random() * (width - maxR * 2),
                y: 100 + maxR + Math.random() * (height - 100 - maxR * 2),
                r: 10,
                maxR: maxR,
                emoji: '🎷'
            });
        }

        function update() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, width, height);

            spawnTimer++;
            // Ускорение появления со временем
            const spawnRate = Math.max(20, 60 - Math.floor(score / 50)); 
            if (spawnTimer >= spawnRate) {
                spawnSax();
                spawnTimer = 0;
            }

            let currentStressIncrease = 0;

            for (let i = saxophones.length - 1; i >= 0; i--) {
                let s = saxophones[i];
                s.r += 0.5; // Рост саксофона
                
                if (s.r > s.maxR) s.r = s.maxR;
                
                // Расчет влияния на стресс (чем больше, тем быстрее растет стресс)
                currentStressIncrease += (s.r / s.maxR) * 0.1;

                // Отрисовка
                ctx.font = `${s.r * 2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(s.emoji, s.x, s.y);
            }

            stress += currentStressIncrease;
            stressBar.style.width = `${Math.min(100, stress)}%`;

            if (stress >= 100) {
                return gameOver();
            }

            requestAnimationFrame(update);
        }

        function handleTap(x, y) {
            if (!isPlaying) return;
            for (let i = saxophones.length - 1; i >= 0; i--) {
                let s = saxophones[i];
                let dx = s.x - x;
                let dy = s.y - y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                // Проверка попадания по радиусу (хитбокс чуть больше визуального размера)
                if (dist <= s.r * 1.5) {
                    saxophones.splice(i, 1);
                    score += 10;
                    stress = Math.max(0, stress - 2); // Немного снижаем стресс за успех
                    document.getElementById('score').textContent = score;
                    break; // Один тап - один саксофон
                }
            }
        }

        // Поддержка тапов (мобильные)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleTap(e.touches[i].clientX, e.touches[i].clientY);
            }
        });

        // Поддержка кликов (ПК)
        canvas.addEventListener('mousedown', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        function gameOver() {
            isPlaying = false;
            screens.ui.classList.add('hidden');
            screens.over.classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            screens.start.classList.add('hidden');
            screens.ui.classList.remove('hidden');
            init();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            screens.over.classList.add('hidden');
            screens.ui.classList.remove('hidden');
            init();
        });
    </script>
</body>
</html>
